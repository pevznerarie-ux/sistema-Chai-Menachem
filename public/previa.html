<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Chai Menachem</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --side-bg:#0b1634; --side-bg2:#16244c; --side-fg:#c5cde0; --side-dim:#a9b3cb; --side-strong:#ffffff; --side-on-bg:#8a6a2a; --side-on-fg:#ffffff; --side-line:transparent;
  --brand-ic:#c8a04a; --brand-1:#f4e8c9; --brand-2:#d9c48f; --me-av-bg:#ffffff; --me-av-fg:#0b1634;
  --primary:#0b1634; --primary-2:#16244c; --accent:#8a6a2a; --accent-bg:#f1f6ff; --head:var(--font);
  --cta:#15984a; --cta-h:#12843f; --cta2:#6a2bd9; --cta2-h:#5a22c0; --cta3:#2463eb; --cta3-h:#1d54cf;
  --link:#1b4fc4; --focus:#2463eb;
  --bg:#f3f5f9; --card:#ffffff; --line:#e3e7ef; --line-2:#eef1f6; --hover:#f8fafd;
  --ink:#0f1a36; --ink-2:#4b5675; --ink-3:#7f8aa3;
  --green:#15984a; --green-bg:#e4f5ea; --green-ink:#0d7437;
  --purple:#6a2bd9; --purple-bg:#efe8fd; --purple-ink:#5521b5;
  --blue:#2463eb; --blue-bg:#e5edfd; --blue-ink:#1b4fc4;
  --amber:#c98a12; --amber-bg:#fcf1d8; --amber-ink:#8a5a06;
  --red:#d03b3b; --red-bg:#fce6e6; --red-ink:#a82a2a;
  --gray-bg:#eceff4;
  --s1:#2a78d6; --s1-soft:#86b6ef; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  /* Layout: fixed navy sidebar (216px) + fluid work area; every screen is a head row, then white cards on a grid, dense 13px type. */
}
:root[data-skin="elegante"]{
  --side-bg:#0e2a26; --side-bg2:#17403a; --side-fg:#c3d6d0; --side-dim:#9db8b0; --side-on-bg:#c9a96a; --side-on-fg:#10231f;
  --brand-ic:#d2b47a; --brand-1:#f3ead6; --brand-2:#d2b47a; --me-av-fg:#0e2a26;
  --primary:#0e2a26; --primary-2:#17403a; --accent:#a8873f; --accent-bg:#f3ecdc;
  --cta:#0f6b53; --cta-h:#0c5946; --cta2:#8a6d33; --cta2-h:#755b29; --cta3:#0f6b53; --cta3-h:#0c5946;
  --link:#0c5f4a; --focus:#0f6b53;
  --bg:#f4f1e8; --line:#e6e2d6; --line-2:#efece2; --hover:#faf8f2;
  --ink:#14231f; --ink-2:#4c5a55; --ink-3:#7d8a85;
  --head:"Fraunces",Georgia,"Times New Roman",serif; --display:"Fraunces",Georgia,"Times New Roman",serif;
}
:root[data-skin="moderno"]{
  --side-bg:#ffffff; --side-bg2:#f1f3f7; --side-fg:#4a5263; --side-dim:#6b7385; --side-strong:#111827; --side-on-bg:#e9eefe; --side-on-fg:#2447d6; --side-line:#e5e8ee;
  --brand-ic:#2f5bea; --brand-1:#111827; --brand-2:#6b7385; --me-av-bg:#161b26; --me-av-fg:#ffffff;
  --primary:#161b26; --primary-2:#2a3140; --accent:#2f5bea; --accent-bg:#e9eefe;
  --cta:#2f5bea; --cta-h:#2447d6; --cta2:#161b26; --cta2-h:#2a3140; --cta3:#2f5bea; --cta3-h:#2447d6;
  --link:#2447d6; --focus:#2f5bea;
  --bg:#f7f8fa; --line:#e5e8ee; --line-2:#eff1f5; --hover:#f8f9fb;
  --ink:#111827; --ink-2:#4a5263; --ink-3:#7b8494;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.ic{flex:none;display:block}
small{font-size:11.5px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ---------- shell ---------- */
.app{display:flex;height:100%}
.side{width:216px;flex:none;background:var(--side-bg);color:var(--side-fg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;color:var(--brand-ic)}
.brand b{display:block;font:600 17px/1 var(--display);letter-spacing:.08em;color:var(--brand-1)}
.brand span{display:block;font:500 10.5px/1 var(--display);letter-spacing:.2em;color:var(--brand-2);margin-top:4px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{border:0;background:none;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--side-fg);text-align:left}
.nav button:hover{background:var(--side-bg2);color:var(--side-strong)}
.nav button.on{background:var(--side-on-bg);color:var(--side-on-fg)}
.nav button:focus-visible{outline-color:var(--brand-ic)}
.nav .chev{margin-left:auto;opacity:.7}
.nav .subnav{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px 26px}
.nav .subnav button{padding:5px 10px;font-size:12px;color:var(--side-dim)}
.nav .subnav button.on{background:none;color:var(--side-strong);font-weight:700}
.me{margin:10px;padding:10px;border-radius:10px;background:var(--side-bg2);display:flex;align-items:center;gap:10px;color:var(--side-strong)}
.me small{color:var(--side-dim);display:block}
.me .av{background:var(--me-av-bg);color:var(--me-av-fg)}
.pbar svg{margin-top:2px}
.app:not(.topnav) .gbar{display:flex;align-items:center;gap:12px}
.gbar .tb-sync{margin-left:0}
.gbar .gs-wrap .search{background:var(--card);border-color:var(--line)}
[data-skin="elegante"] .gbar{background:transparent;border:0;padding:12px 12px 0}
.styles{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}
.styles button{border:1px solid #e3cf9b;background:#fff8e4;color:var(--amber-ink);border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:600}
.styles button.on{background:var(--amber-ink);color:#fff;border-color:var(--amber-ink)}
.subbar{flex:1 0 100%;display:flex;gap:4px;padding:6px 0;border-top:1px solid var(--line-2);overflow-x:auto}
.subbar button{border:0;background:none;padding:5px 10px;border-radius:6px;font-weight:600;font-size:12px;color:var(--side-dim);white-space:nowrap}
.subbar button:hover{color:var(--side-strong)}
.subbar button.on{background:var(--accent-bg);color:var(--link)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:none;align-items:center;gap:10px;background:var(--side-bg);color:var(--brand-1);padding:10px 14px;border-bottom:1px solid var(--side-line)}
.topbar b{font:600 14px/1 var(--display);letter-spacing:.08em}
.topbar button{border:0;background:none;color:var(--side-strong);padding:4px;border-radius:6px}
.pbar{background:var(--amber-bg);color:var(--amber-ink);font-size:12px;padding:6px 24px;border-bottom:1px solid #f1e2b8;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.page{flex:1;overflow-y:auto;padding:20px 24px 48px}
.scrim{display:none}

/* ---------- head ---------- */
.back{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px;margin-bottom:12px}
.back:hover{color:var(--ink)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:21px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.phead h1,.prof-name h1,.m-h h2{font-family:var(--head)}
.phead .sub-t{color:var(--ink-2);margin-top:2px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- buttons, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:12.5px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#c9d0de;background:#fafbfd}
.btn-green{background:var(--cta);border-color:var(--cta);color:#fff}.btn-green:hover{background:var(--cta-h);border-color:var(--cta-h)}
.btn-purple{background:var(--cta2);border-color:var(--cta2);color:#fff}.btn-purple:hover{background:var(--cta2-h);border-color:var(--cta2-h)}
.btn-navy{background:var(--primary);border-color:var(--primary);color:#fff}.btn-navy:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn-blue{background:var(--cta3);border-color:var(--cta3);color:#fff}.btn-blue:hover{background:var(--cta3-h);border-color:var(--cta3-h)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-link{border:0;background:none;padding:0;color:var(--link);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.btn-link:hover{text-decoration:underline}
.ibtn{border:0;background:none;width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink-2)}
.ibtn:hover{background:var(--gray-bg);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5}
.b-green{background:var(--green-bg);color:var(--green-ink)}
.b-purple{background:var(--purple-bg);color:var(--purple-ink)}
.b-amber{background:var(--amber-bg);color:var(--amber-ink)}
.b-red{background:var(--red-bg);color:var(--red-ink)}
.b-blue{background:var(--blue-bg);color:var(--blue-ink)}
.b-gray{background:var(--gray-bg);color:var(--ink-2)}

/* ---------- cards & grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.pad0{padding:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ct{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.g2,.g3,.g4,.g5,.g6{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:16px;align-items:start}
.split-w{grid-template-columns:minmax(0,1fr) 300px}
.split-l{grid-template-columns:262px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.mt{margin-top:16px}

/* ---------- toolbar, tabs ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px 0}
.card:not(.pad0)>.toolbar{padding:0;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-3);flex:1 1 220px;min-width:180px;max-width:340px}
.search:focus-within{border-color:var(--focus)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.inp{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;min-width:0;max-width:100%}
select.inp{padding-right:6px}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;min-height:72px;width:100%;line-height:1.45}
.inp:focus{border-color:var(--focus);outline:0}
.inp.bad{border-color:var(--red)}
.pills{display:flex;gap:4px;padding:12px 16px;overflow-x:auto}
.pill{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap}
.pill:hover{background:var(--gray-bg)}
.pill.on{background:var(--primary);color:#fff}
.utabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.utab{border:0;background:none;padding:9px 0;font-weight:600;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.utab:hover{color:var(--ink)}
.utab.on{color:var(--link);border-bottom-color:var(--focus)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;height:32px;padding:0 12px;font-weight:600;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--primary);color:#fff}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--hover)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl td.num,.tbl th.num{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block}
.two span{display:block;font-weight:500}
.two small{display:block}
.tel{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tel svg{color:var(--green)}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.02em;background:var(--blue)}
.av-sm{width:26px;height:26px;font-size:10px}
.av-lg{width:44px;height:44px;font-size:15px}
.av-xl{width:60px;height:60px;font-size:20px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line-2);color:var(--ink-2);font-size:12px}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{border:1px solid var(--line);background:#fff;min-width:28px;height:28px;border-radius:7px;font-weight:600;font-size:12px;color:var(--ink-2);display:inline-grid;place-items:center;padding:0 6px}
.pager button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:2px}

/* ---------- small pieces ---------- */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);min-width:0}
.rw:last-child{border-bottom:0}
.rw .grow{flex:1;min-width:0}
.rw b{font-weight:600}
button.rw{border:0;border-bottom:1px solid var(--line-2);background:none;width:100%;text-align:left}
button.rw:hover{background:var(--hover)}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.d-green{background:var(--green-bg);color:var(--green-ink)}.d-purple{background:var(--purple-bg);color:var(--purple-ink)}
.d-amber{background:var(--amber-bg);color:var(--amber-ink)}.d-red{background:var(--red-bg);color:var(--red-ink)}
.d-blue{background:var(--blue-bg);color:var(--blue-ink)}.d-gray{background:var(--gray-bg);color:var(--ink-2)}
.checks{display:flex;flex-direction:column;gap:7px}
.checks span{display:flex;align-items:center;gap:8px}
.checks svg{color:var(--green)}
.checks .off{color:var(--ink-3)}.checks .off svg{color:#c3cad8}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.stat .lab{display:block;font-size:11.5px;color:var(--ink-2)}
.stat .val{font-weight:700;font-size:13px;margin-top:1px;overflow-wrap:anywhere}
.stat small{display:block}
button.stat{text-align:left;font:inherit}
button.stat:hover{border-color:#c9d0de}
.stat.on{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .lab{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:4px;line-height:1.15}
.kpi .dl{font-size:11.5px;margin-top:3px;color:var(--ink-3)}
.kpi .up{color:var(--green-ink);font-weight:600}.kpi .down{color:var(--red-ink);font-weight:600}
.meter{height:8px;border-radius:99px;background:#d6e4f8;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--s1)}
.meter.m-amber{background:#f8e7bd}.meter.m-amber i{background:var(--amber)}
.meter.m-green{background:#cfecd9}.meter.m-green i{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:340px;height:auto}
.chart text{font-family:var(--font)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--primary);color:#fff;padding:6px 9px;border-radius:7px;font-size:11.5px;line-height:1.35;max-width:220px;box-shadow:0 6px 18px rgba(11,22,52,.25);display:none}
.tip b{display:block}
.switch{position:relative;width:36px;height:20px;border-radius:99px;border:0;background:#c9d0de;flex:none;padding:0}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--green)}.switch.on i{left:18px}
.star{border:0;background:none;padding:0;font-size:18px;line-height:1;color:#c3cad8}
.star.on{color:#e3a917}

/* ---------- profile ---------- */
.prof-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.prof-id{flex:1;min-width:200px}
.prof-name{display:flex;align-items:center;gap:8px}
.prof-name h1{font-size:21px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prof-acts{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.prof-acts .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.info.i6{grid-template-columns:repeat(6,minmax(0,1fr))}
.info div{min-width:0;display:flex;gap:10px;align-items:flex-start}
.info svg{color:var(--ink-2);margin-top:2px}
.info .lab{display:block;font-size:11.5px;color:var(--ink-2)}
.info .val{display:block;font-weight:600;overflow-wrap:anywhere}
.geral{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.15fr);gap:16px;align-items:start}
.pgeral{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.foot-add{border:0;border-top:1px solid var(--line-2);background:none;width:100%;padding:11px 0 0;margin-top:6px;color:var(--link);font-weight:600;font-size:12.5px;display:flex;justify-content:center;align-items:center;gap:6px}
.foot-add:hover{text-decoration:underline}

/* ---------- forms ---------- */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{grid-column:1/-1;min-width:0;display:flex;flex-direction:column;gap:5px}

.hint{font-size:11.5px;color:var(--ink-3)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);cursor:pointer}
.chk input,.radio input{width:15px;height:15px;accent-color:var(--focus);margin:0}
.chk.field{flex-direction:row;align-items:center}
.radios{display:flex;gap:16px}
.radio{display:flex;align-items:center;gap:6px;cursor:pointer}
.fsec{font-size:13.5px;font-weight:700;margin:6px 0 12px}
.fsec:not(:first-child){margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}

/* ---------- modal, menu, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,22,52,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}

.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(11,22,52,.16);padding:5px;min-width:190px;display:flex;flex-direction:column}

.toast svg{color:#7fe0a2}
.toast.warn svg{color:#ffd27a}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);min-width:640px}
.cal .dw{padding:8px;font-size:11.5px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-2)}

/* ---------- estilo Elegante ---------- */

/* ---------- estilo Moderno ---------- */

[data-skin="moderno"] .menu{border-radius:8px}
.app.topnav{flex-direction:column}
.app.topnav .side{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible;padding:0 24px;border-right:0;border-bottom:1px solid var(--line);column-gap:22px}

/* ---------- novos componentes ---------- */
.gs-wrap{position:relative;flex:0 1 230px;min-width:150px}

.gs-res{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(17,24,39,.16);z-index:35;padding:6px;max-height:70vh;overflow:auto}

.tb-ic i{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font:700 10px/16px var(--font);font-style:normal;text-align:center}
button.me{border:0;font:inherit;text-align:left;cursor:pointer}
.bnav{display:none;background:var(--card);border-top:1px solid var(--line);padding:4px 6px}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;font-size:10.5px;font-weight:600;color:var(--ink-3);min-width:0}
.bnav button.on{color:var(--link)}
.lock{padding:36px 16px;text-align:center;color:var(--ink-2)}
.lock svg{margin:0 auto 8px;color:var(--ink-3)}
.lock b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.sc{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sc .meter{width:64px}
.meter.m-red{background:#f6d5d5}.meter.m-red i{background:var(--red)}
.need{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.need p{color:var(--ink-2);font-size:12px;flex:1}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--gray-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.rcb{border:1px solid var(--line);border-radius:8px;padding:18px}
.rcb-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:12px}

.rcb .big{font-size:24px;font-weight:700;margin:4px 0 12px}
.camp{display:flex;flex-direction:column;gap:10px}
.camp .meter{height:10px}
.mesa{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.mesa.full{background:var(--green-bg);border-color:#bfe5cb}
.mesa small{display:block;overflow-wrap:anywhere}
.portal{max-width:880px;margin:0 auto}
.portal-hero{background:var(--primary);color:#fff;border-radius:12px;padding:22px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.portal-hero h2{font-size:20px;font-weight:700}
.portal-hero p{color:#c9cfdb}
.tagx{border:0;cursor:pointer;font-family:inherit}
.cal2 .cell{min-height:104px}
.cal .hol{display:block;margin-top:3px;padding:2px 5px;border-radius:5px;background:var(--purple-bg);color:var(--purple-ink);font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.evb{background:var(--blue-bg);color:var(--blue-ink)}
.cal .tm{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-2);font-weight:600}
.cal .ct2{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-3)}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.pres-on,.pres-on:hover{background:var(--green);border-color:var(--green);color:#fff}
.app.topnav .side{column-gap:12px}
.app.topnav .brand{margin-right:8px}

.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column}

.auth .sub{color:var(--ink-2);margin-bottom:18px}
.auth .field{margin-bottom:12px}
.auth .btn{width:100%;height:38px;margin-top:6px}

.sync{font-size:11.5px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none}
.sync svg{color:var(--green)}

.tb-sync{margin-left:auto}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .split,.split-w,.split-l{grid-template-columns:minmax(0,1fr)}

  .app.open .side{transform:none}

  .topbar{display:flex}
  .gbar{display:flex}

  .fgrid{grid-template-columns:minmax(0,1fr)}
  .field.half{grid-column:1/-1}
  .search{max-width:none}
}
@media (max-width:900px){
  [data-skin="elegante"] .app{padding:0;gap:0}
  [data-skin="elegante"] .side{border-radius:0}
  [data-skin="elegante"] .pbar{margin:10px 16px 0}
  [data-skin="elegante"] .page{padding:16px 16px 40px}
  [data-skin="elegante"] .phead h1,[data-skin="elegante"] .prof-name h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-act="closeNav"></div>
  <div class="main">
    <div class="topbar"><button type="button" data-act="openNav" aria-label="Abrir menu" id="nav-btn"></button><b>CHAI MENACHEM</b></div>
    <div class="gbar"><div class="gs-wrap"><label class="search"><input id="gs-m" type="search" placeholder="Buscar família, pessoa, evento..." aria-label="Busca geral" data-on="gsearch" autocomplete="off"></label><div class="gs-res" hidden></div></div></div>
    <div class="pbar" id="pbar"></div>
    <main class="page" id="page"></main>
    <nav class="bnav" id="bnav" aria-label="Atalhos"></nav>
  </div>
</div>
<div id="auth" style="display:none;height:100%"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<script>
const PREV=true;
'use strict';
/* ================= helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((toDate(a)-toDate(b))/864e5);
const TODAY=isoOf(new Date()), Y=+TODAY.slice(0,4), YM=TODAY.slice(0,7);
const fmtDate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
const fmtDM=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=MESES.map(m=>m.slice(0,3));
const compTxt=c=>MESES[+c.slice(5,7)-1]+'/'+c.slice(0,4);
const pl=(n,s,p)=>n+' '+(n===1?s:p);
function ago(s){const n=diffDays(TODAY,s);if(n<0)return inDays(s);if(n===0)return 'hoje';if(n===1)return 'ontem';if(n<60)return n+' dias atrás';if(n<365)return Math.round(n/30)+' meses atrás';return pl(Math.floor(n/365),'ano','anos')+' atrás'}
function inDays(s){const n=diffDays(s,TODAY);if(n<0)return ago(s);if(n===0)return 'hoje';if(n===1)return 'amanhã';return 'em '+n+' dias'}
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const BRL0=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const NUM=v=>(+v||0).toLocaleString('pt-BR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function parseMoney(s){s=String(s??'').replace(/[^\d,.-]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
const age=n=>{if(!n)return null;let a=Y-+n.slice(0,4);if(TODAY.slice(5)<n.slice(5))a--;return a};
const initials=n=>{const p=String(n||'').trim().split(/\s+/);return(((p[0]||'')[0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};

/* ================= calendário hebraico ================= */
const HEB=(()=>{
  const PT={Tishri:'Tishrei',Heshvan:'Cheshvan',Kislev:'Kislev',Tevet:'Tevet',Shevat:'Shevat',Adar:'Adar','Adar I':'Adar I','Adar II':'Adar II',Nisan:'Nissan',Iyar:'Iyar',Sivan:'Sivan',Tamuz:'Tamuz',Av:'Av',Elul:'Elul'};
  const MONTHS=['Tishrei','Cheshvan','Kislev','Tevet','Shevat','Adar','Adar I','Adar II','Nissan','Iyar','Sivan','Tamuz','Av','Elul'];
  let fmt=null;
  try{
    const f=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
    const p=f.formatToParts(new Date(2026,10,15,12));
    if(p.some(x=>x.type==='month'&&x.value==='Kislev')&&p.some(x=>x.type==='day'&&x.value==='5'))fmt=f;
  }catch(e){}
  const cache=new Map();
  function of(iso){
    if(!fmt||!iso)return null;
    let v=cache.get(iso);if(v)return v;
    const p=fmt.formatToParts(toDate(iso)),g=t=>(p.find(x=>x.type===t)||{}).value;
    v={d:+g('day'),m:PT[g('month')]||g('month'),y:+g('year')};cache.set(iso,v);return v;
  }
  const fwd=new Map(),back=new Map();
  if(fmt){
    for(let i=0;i<400;i++){const s=addDays(TODAY,i),h=of(s),k=h.m+'|'+h.d;if(!fwd.has(k))fwd.set(k,s)}
    for(let i=1;i<=400;i++){const s=addDays(TODAY,-i),h=of(s),k=h.m+'|'+h.d;if(!back.has(k))back.set(k,s)}
  }
  // Adar em ano comum x ano embolísmico: yahrzeit de Adar é observado em Adar I; Adar I/II caem em Adar no ano comum
  const alts=m=>m==='Adar'?['Adar','Adar I']:m==='Adar I'?['Adar I','Adar']:m==='Adar II'?['Adar II','Adar']:[m];
  function find(map,m,d,dir){
    let best=null;
    for(const a of alts(m)){const s=map.get(a+'|'+d);if(s&&(!best||(dir>0?s<best:s>best)))best=s}
    if(!best&&d===30)return find(map,m,29,dir);
    return best;
  }
  const same=(h,m,d)=>!!h&&h.d===d&&alts(m).includes(h.m);
  return{ok:!!fmt,MONTHS,of,alts,same,next:(m,d)=>find(fwd,m,d,1),prev:(m,d)=>find(back,m,d,-1),txt:h=>h?h.d+' de '+h.m:'—'};
})();

function pager(total,u,size,key,noun){
  size=+size||10;const pages=Math.max(1,Math.ceil(total/size)),p=+u.page||1;
  if(!total)return '';
  let nums=[];
  if(pages<=7)for(let i=1;i<=pages;i++)nums.push(i);
  else if(p<=4)nums=[1,2,3,4,5,'…',pages];
  else if(p>=pages-3)nums=[1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  else nums=[1,'…',p-1,p,p+1,'…',pages];
  const b=(n,l,dis,on)=>`<button type="button" ${dis?'disabled':''} class="${on?'on':''}" data-tab="${key}.page:${n}" aria-label="Página ${n}">${l}</button>`;
  return `<div class="pager"><span>Mostrando ${(p-1)*size+1} a ${Math.min(total,p*size)} de ${NUM(total)} ${noun}</span><div class="pg">${b(p-1,ic('prev',14),p<=1)}${nums.map(n=>n==='…'?'<span class="muted">…</span>':b(n,n,false,n===p)).join('')}${b(p+1,ic('next',14),p>=pages)}</div></div>`;
}

async function download(name,data){
  if(!(window.claude&&window.claude.use)){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Arquivo baixado: '+name);return 'ok'}catch(e){return 'fail'}}
  toast('Preparando o arquivo…');let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast('Arquivo salvo: '+name);return 'ok'}catch(e){if(e&&e.code==='declined')return 'no'}}
  return 'fail';
}
async function saveFile(name,rows){
  if((await download(name,csv(rows)))!=='fail')return;
  openModal({title:name,wide:true,body:`<p class="intro">Não deu para baixar o arquivo por aqui. Copie o conteúdo e cole no Excel ou no Google Planilhas.</p><textarea class="inp" id="copy-txt" rows="10" readonly>${esc(rows.map(r=>r.join('\t')).join('\n'))}</textarea>`,
    footer:`<button type="button" class="btn" data-act="closeModal">Fechar</button><button type="button" class="btn btn-green" data-act="copyTxt">${ic('copy',15)}Copiar</button>`});
}
A.copyTxt=()=>{const t=$('#copy-txt');if(!t)return;t.select();const ok=()=>toast('Copiado.'),no=()=>toast('Selecione o texto e copie com Ctrl+C.',1);try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}};

function famFiltered(){
  const u=S.ui.fl,q=norm(u.q).trim(),qd=u.q.replace(/\D/g,''),d30=addDays(TODAY,-30);
  return DB.fam.filter(f=>(FL_FN[u.tab]||FL_FN.todos)(f)&&(!u.cat||f.cat===u.cat)&&(!u.status||f.status===u.status)&&(!u.mens||mensStatus(f)===u.mens)&&(!u.part||f.part[u.part])
    &&(!u.cad||(u.cad==='ano'?+f.cad.slice(0,4)===Y:f.cad>=d30))&&(!u.tag||(f.tags||[]).includes(u.tag))&&(!q||famSearch(f).includes(q)||(qd.length>=4&&famSearch(f).includes(qd))));

function dF(k,label,o){
  o=o||{};const d=S.draft,v=getPath(d,k)??'',id='d-'+k.replace(/\./g,'-'),e=d.err[k];let c;
  if(o.opts)c=`<select class="inp ${e?'bad':''}" id="${id}" data-d="${k}">${o.ph?`<option value="">${o.ph}</option>`:''}${o.opts.map(x=>opt(x,x,v)).join('')}</select>`;
  else if(o.area)c=`<textarea class="inp" id="${id}" data-d="${k}" rows="${o.area}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`;
  else c=`<input class="inp ${e?'bad':''}" id="${id}" data-d="${k}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.im?`inputmode="${o.im}"`:''}>`;
  return `<div class="field ${o.full?'':'half'}"><label for="${id}">${label}${o.req?' <i class="req">*</i>':''}</label>${c}<span class="err">${e||''}</span></div>`;
}

/* ================= Financeiro da família ================= */
function finHistory(fid){
  const h=[];
  ixOf(IX.pay,fid).forEach(p=>{if(p.pagoEm)h.push({data:p.pagoEm,txt:'Pagamento mensalidade '+compTxt(p.comp),valor:p.valor,forma:p.forma,tipo:'Mensalidade'})});
  ixOf(IX.don,fid).forEach(d=>h.push({data:d.data,txt:d.tipo,valor:d.valor,forma:d.forma,tipo:'Doação'}));
  ixOf(IX.reg,fid).forEach(e=>{if(e.valor)e.regs.forEach(r=>{if(r.fid===fid&&r.pago&&!r._h){h.push({data:r.em,txt:'Pagamento evento '+e.nome.split(' – ')[0],valor:e.valor*r.q,forma:'—',tipo:'Evento'})}})});
  return h.filter((x,i,a)=>a.findIndex(y=>y.data===x.data&&y.txt===x.txt&&y.valor===x.valor)===i).sort(by(x=>x.data,-1));
}
function pgFinFam(id){
  const f=FAM.get(id);if(!f)return notFound();
  const tab=S.ui.finTab,pays=ixOf(IX.pay,id),dons=ixOf(IX.don,id).slice().sort(by(d=>d.data,-1)),proms=ixOf(IX.prom,id),s=finSummary(id),hist=finHistory(id),np=nextPay(id),yr=x=>+x.slice(0,4)===Y;
  const years=[...new Set(pays.map(p=>p.comp.slice(0,4)).concat(String(Y)))].sort().reverse();
  if(!years.includes(S.ui.finAno))S.ui.finAno=years[0];

  const outros=`<div class="card"><div class="ct" style="margin-bottom:12px">Outros recebimentos</div><div class="g4 keep2">
    <div><small>Doações (${Y})</small><div style="font-weight:700;font-size:15px" class="num">${BRL(s.donAno)}</div><button type="button" class="btn-link" data-tab="finTab:doacoes">Ver detalhes</button></div>
    <div><small>Promessas</small><div style="font-weight:700;font-size:15px" class="num">${BRL(s.promTot)}</div>${s.promPend?`<small style="color:var(--red-ink);display:block">${BRL(s.promPend)} pendente</small>`:''}<button type="button" class="btn-link" data-tab="finTab:promessas">Ver detalhes</button></div>
    <div><small>Eventos pagos (${Y})</small><div style="font-weight:700;font-size:15px" class="num">${BRL(evPago)}</div><button type="button" class="btn-link" data-tab="finTab:historico">Ver detalhes</button></div>
    <div><small>Total arrecadado (${Y})</small><div style="font-weight:700;font-size:15px" class="num">${BRL(totAno)}</div><button type="button" class="btn-link" data-go="relatorios">Ver relatório completo</button></div></div></div>`;
  let body='';
  if(tab==='mensalidades'){
    const list=pays.filter(p=>p.comp.slice(0,4)===ano&&(!st||payStatus(p)===st)).sort(by(p=>p.comp,-1)),all=pays.filter(p=>p.comp.slice(0,4)===ano);
    body=`<div class="split split-w"><div class="card pad0">
      <div class="toolbar" style="padding-bottom:12px"><div class="ct">Mensalidades</div><span style="flex:1"></span>
        <select class="inp" id="fin-ano" data-f="finAno" aria-label="Ano">${years.map(y=>opt(y,y,ano)).join('')}</select>
        <select class="inp" id="fin-st" data-f="finSt" aria-label="Status">${opt('','Todos',st)}${['Pago','Aberto','Atrasado'].map(x=>opt(x,x,st)).join('')}</select>
        ${btn('Gerar mensalidades','plus','btn-blue',`data-act="gerarMens" data-id="${id}"`)}</div>
      ${list.length?`<div class="tw"><table class="tbl"><thead><tr><th>Mês / Competência</th><th>Vencimento</th><th class="num">Valor</th><th>Status</th><th>Pago em</th><th>Forma de pagamento</th><th class="right">Ações</th></tr></thead><tbody>${list.map(p=>`<tr>
        <td><b>${compTxt(p.comp)}</b></td><td class="num">${fmtDate(p.venc)}</td><td class="num">${BRL(p.valor)}</td><td>${payBadge(p)}</td><td class="num">${p.pagoEm?fmtDate(p.pagoEm):'<span class="muted">—</span>'}</td><td>${p.pagoEm?esc(p.forma):'<span class="muted">—</span>'}</td>
        <td class="acts">${p.pagoEm?`<button type="button" class="ibtn" title="Ver recibo" aria-label="Ver recibo" data-act="recibo" data-id="${id}" data-arg="pay:${p.id}">${ic('receipt',15)}</button>`:`<button type="button" class="ibtn" title="Link de pagamento" aria-label="Link de pagamento" data-act="payLink" data-id="${id}" data-arg="pay:${p.id}">${ic('link',15)}</button><button type="button" class="ibtn" title="Dar baixa (marcar como paga)" aria-label="Dar baixa" data-act="baixa" data-id="${p.id}">${ic('check',15)}</button>`}<button type="button" class="ibtn" title="Editar" aria-label="Editar" data-act="editPay" data-id="${p.id}">${ic('edit',15)}</button></td></tr>`).join('')}</tbody></table></div>`
        :empty(f.mens.ativa||pays.length?'Nenhuma mensalidade com este filtro.':'Esta família não possui mensalidade.','Use “Gerar mensalidades” para criar as cobranças do ano.')}
    </div>
    <div class="card"><div class="ct" style="margin-bottom:6px">Resumo ${ano}</div><div class="rows">
      <div class="rw"><span class="grow">Total mensalidades</span><b class="num" style="color:var(--green-ink)">${BRL(sum(all,p=>p.valor))}</b></div>
      <div class="rw"><span class="grow">Total pago</span><b class="num" style="color:var(--green-ink)">${BRL(sum(all.filter(p=>p.pagoEm),p=>p.valor))}</b></div>
      <div class="rw"><span class="grow">Total em aberto</span><b class="num" style="${all.some(p=>!p.pagoEm&&p.venc<TODAY)?'color:var(--red-ink)':''}">${BRL(sum(all.filter(p=>!p.pagoEm),p=>p.valor))}</b></div>
      <div class="rw"><span class="grow">Próximo vencimento</span><b class="num">${np?fmtDate(np.venc):'—'}</b></div>
      <div class="rw"><span class="grow">Valor</span><b class="num">${f.mens.ativa?BRL(f.mens.valor):'—'}</b></div></div></div></div>
    <div class="g2 mt">${outros}${histCard(4)}</div>`;
  }else if(tab==='resumo'){

  }else if(tab==='doacoes'){

  }else if(tab==='promessas'){
    body=`<div class="card pad0"><div class="toolbar" style="padding-bottom:12px;justify-content:space-between"><div class="ct">Promessas (${proms.length})</div>${btn('Nova promessa','plus','btn-sm',`data-act="novaProm" data-id="${id}"`)}</div>
      ${proms.length?`<div class="tw"><table class="tbl"><thead><tr><th>Promessa</th><th>Quem prometeu</th><th>Data</th><th class="num">Prometido</th><th class="num">Pago</th><th class="num">Pendente</th><th>Progresso</th><th class="right">Ações</th></tr></thead><tbody>${proms.map(p=>`<tr><td><b>${esc(p.desc)}</b></td><td>${esc((PPL.get(p.pid)||{}).nome||'—')}</td><td class="num">${fmtDate(p.data)}</td><td class="num">${BRL(p.total)}</td><td class="num">${BRL(p.pago)}</td><td class="num" style="${p.total>p.pago?'color:var(--red-ink);font-weight:600':''}">${BRL(p.total-p.pago)}</td>

  }else if(tab==='historico'){

A.finMore=el=>{const id=+el.dataset.id;openMenu(el,[{label:'Registrar doação',icon:'heart',act:'doacao',id},{label:'Nova promessa',icon:'plus',act:'novaProm',id},{label:'Gerar mensalidades',icon:'calendar',act:'gerarMens',id},{label:'Link de pagamento',icon:'link',act:'payLink',id,arg:'don'},{label:'Informe anual',icon:'file',act:'informe',id},'-',{label:'Exportar extrato',icon:'download',act:'exportFin',id}])};

A.baixa=el=>{const p=DB.pay.find(x=>x.id===+el.dataset.id);if(!p)return;p.pagoEm=TODAY;render();toast('Mensalidade de '+compTxt(p.comp)+' marcada como paga.')};
A.editPay=el=>{const p=DB.pay.find(x=>x.id===+el.dataset.id);if(!p)return;formModal({title:'Mensalidade de '+compTxt(p.comp),fields:[
  {k:'valor',label:'Valor (R$)',type:'money',req:true,val:String(p.valor).replace('.',','),half:true},{k:'venc',label:'Vencimento',type:'date',req:true,val:p.venc,half:true},
  {k:'sit',label:'Situação',type:'select',opts:[['aberto','Em aberto'],['pago','Paga']],val:p.pagoEm?'pago':'aberto',half:true},{k:'pagoEm',label:'Pago em',type:'date',val:p.pagoEm||'',half:true,max:TODAY},

A.gerarMens=el=>{const f=FAM.get(+el.dataset.id);formModal({title:'Gerar mensalidades',intro:'Cria as cobranças mensais de '+esc(famName(f))+' para o ano escolhido. Meses que já existem não são duplicados.',submit:'Gerar',fields:[
  {k:'ano',label:'Ano',type:'number',req:true,val:+S.ui.finAno||Y,half:true,min:2000,max:2100},{k:'dia',label:'Dia de vencimento',type:'select',opts:['1','5','10','15','20','25'],val:String(f.mens.dia||DB.cfg.diaPadrao),half:true},
  {k:'valor',label:'Valor mensal (R$)',type:'money',req:true,val:String(f.mens.valor||DB.cfg.mensPadrao).replace('.',','),half:true},{k:'forma',label:'Forma de pagamento',type:'select',opts:FORMAS,val:f.mens.forma||'PIX',half:true}],
  onSubmit(v){if(v.ano<2000||v.ano>2100)return 'Informe um ano válido.';let n=0;for(let m=1;m<=12;m++){const comp=v.ano+'-'+pad(m);if(!ixOf(IX.pay,f.id).some(p=>p.comp===comp)){addPay({fid:f.id,comp,venc:comp+'-'+pad(+v.dia),valor:v.valor,pagoEm:null,forma:v.forma});n++}}
    f.mens={ativa:true,valor:v.valor,dia:+v.dia,forma:v.forma};S.ui.finAno=String(v.ano);S.ui.finSt='';toast(n?pl(n,'mensalidade gerada','mensalidades geradas')+' para '+v.ano+'.':'Todas as mensalidades de '+v.ano+' já existiam.',!n)}})};
A.pagamento=el=>{const f=FAM.get(+el.dataset.id),open=ixOf(IX.pay,f.id).filter(p=>!p.pagoEm).sort(by(p=>p.venc)),proms=ixOf(IX.prom,f.id).filter(p=>p.total>p.pago);
  formModal({title:'Registrar pagamento',submit:'Registrar pagamento',fields:[
  {k:'ref',label:'Referente a',type:'select',opts:open.map(p=>['pay:'+p.id,'Mensalidade '+compTxt(p.comp)+' — '+BRL(p.valor)]).concat(proms.map(p=>['prom:'+p.id,'Promessa: '+p.desc+' — pendente '+BRL(p.total-p.pago)]),[['don','Doação avulsa']])},
  {k:'valor',label:'Valor (R$)',type:'money',hint:'Para mensalidade, deixe em branco para lançar o valor cheio.',half:true},{k:'data',label:'Data do pagamento',type:'date',req:true,val:TODAY,half:true,max:TODAY},
  {k:'forma',label:'Forma de pagamento',type:'select',opts:FORMAS,val:f.mens.forma||'PIX'}],
  onSubmit(v){const [t,i]=v.ref.split(':');

/* ================= gráficos ================= */
const compact=v=>v>=1e6?(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':v>=1e3?(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':NUM(Math.round(v));
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=4?4:n<=5?5:n<=8?8:10)*p}
function axis(max,W,H,L,R,T,B,money){let s='';for(let i=0;i<=4;i++){const v=max*i/4,y=T+(H-T-B)*(1-i/4);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${i?'#e9edf3':'#c9d0de'}" stroke-width="1"/><text x="${L-7}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="#7f8aa3">${money&&v?'R$ ':''}${compact(v)}</text>`}
  return s+MES3.map((m,i)=>`<text x="${L+(W-L-R)*(i+.5)/12}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#7f8aa3">${m}</text>`).join('')}
function chartBars(a,b,ya,yb,money){
  const W=600,H=240,L=money?62:38,R=10,T=18,B=26,vals=a.concat(b.filter(x=>x!=null)),max=niceMax(Math.max(1,...vals)),pw=(W-L-R)/12,bw=Math.min(15,(pw-12)/2),y0=H-B,yy=v=>T+(H-T-B)*(1-v/max),f=v=>money?BRL0(v):NUM(v);
  const bar=(x,v,c)=>{if(!v)return '';const y=yy(v),r=Math.min(4,(y0-y)/2);return `<path d="M${x},${y0}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y0}Z" fill="${c}"/>`};
  let s=axis(max,W,H,L,R,T,B,money),peak=-1;b.forEach((v,i)=>{if(v!=null&&(peak<0||v>b[peak]))peak=i});
  for(let i=0;i<12;i++){const cx=L+pw*(i+.5);
    s+=bar(cx-bw-1,a[i],'var(--s1-soft)')+(b[i]!=null?bar(cx+1,b[i],'var(--s1)'):'');
    s+=`<rect x="${L+pw*i}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent" data-tip="${MESES[i]}|${ya}: ${f(a[i])}${b[i]!=null?' · '+yb+': '+f(b[i]):''}"/>`}
  if(peak>=0&&b[peak]){const cx=L+pw*(peak+.5)+1+bw/2;s+=`<text x="${Math.min(W-R-24,Math.max(L+24,cx))}" y="${yy(b[peak])-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f1a36">${money?'R$ ':''}${compact(b[peak])}</text>`}
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de colunas por mês, ${ya} e ${yb}">${s}</svg></div>`;
}
function chartLine(a,b,ya,yb){
  const W=600,H=240,L=38,R=34,T=18,B=26,vals=a.concat(b.filter(x=>x!=null)),max=niceMax(Math.max(1,...vals)),pw=(W-L-R)/12,xx=i=>L+pw*(i+.5),yy=v=>T+(H-T-B)*(1-v/max);
  const pts=arr=>arr.map((v,i)=>v==null?null:[xx(i),yy(v)]).filter(Boolean),pa=pts(a),pb=pts(b),path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('');
  let s=axis(max,W,H,L,R,T,B,false);

  s+=`<path d="${path(pa)}" fill="none" stroke="var(--s1-soft)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="${path(pb)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const end=(p,c)=>p.length?`<circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="4.5" fill="${c}" stroke="#fff" stroke-width="2"/>`:'';
  s+=end(pa,'var(--s1-soft)')+end(pb,'var(--s1)');

  for(let i=0;i<12;i++)s+=`<rect x="${L+pw*i}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent" data-tip="${MESES[i]}|${ya}: ${NUM(a[i])}${b[i]!=null?' · '+yb+': '+NUM(b[i]):''}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linhas por mês, ${ya} e ${yb}">${s}</svg></div>`;

function chartDonut(parts,unit){
  const tot=sum(parts,p=>p.v)||1,r=62,C=2*Math.PI*r;let acc=0,s='';

    <div class="rows" style="flex:1;min-width:150px">${parts.map(p=>`<div class="rw"><i style="width:10px;height:10px;border-radius:3px;background:${p.c};flex:none"></i><span class="grow" style="min-width:0">${esc(p.l)}</span><b class="num">${NUM(p.v)}</b><small class="num" style="width:36px;text-align:right">${pct(p.v,tot)}%</small></div>`).join('')}</div></div>`;

const lastCt=fid=>{let m='';ixOf(IX.ct,fid).forEach(c=>{if(c.feito&&c.tipo!=='pres'&&c.tipo!=='tarefa'&&c.data>m)m=c.data});return m};
function score(f){
  let s=0;const dp=f.pres?diffDays(TODAY,f.pres.data):999;
  s+=dp<=7?40:dp<=14?32:dp<=30?22:dp<=60?10:0;
  s+=Math.min(20,(f._ev12??f.ev12??0)*3+ixOf(IX.reg,f.id).filter(e=>!e.cancel&&e.data>=TODAY).length*4);
  const ms=mensStatus(f);s+=ms==='ok'?15:ms==='late'?5:0;
  if(ixOf(IX.don,f.id).some(d=>d.data>=addDays(TODAY,-365)))s+=10;
  const lc=lastCt(f.id),dc=lc?diffDays(TODAY,lc):999;s+=dc<=30?15:dc<=90?8:0;
  return Math.min(100,s);
}
const scLevel=s=>s>=70?['Alto','green']:s>=40?['Médio','amber']:['Baixo','red'];
const scDrop=f=>(f.sc0||0)-score(f);
const scBadge=f=>{const s=score(f),[l,t]=scLevel(s);return `<span class="badge b-${t}">${ic('chart',11)}Engajamento ${s} · ${l}</span>`};
const scCell=f=>{const s=score(f),t=scLevel(s)[1];return `<span class="sc"><b class="num">${s}</b><span class="meter m-${t}"><i style="width:${s}%"></i></span></span>`};

/* ================= momentos e necessidades de contato ================= */
const LIFE={nasc:['Nascimento','green','child'],brit:['Brit Milá','blue','star'],bar:['Bar ou Bat Mitzvá','purple','star'],noiv:['Noivado','purple','heart'],casam:['Casamento','purple','heart'],luto:['Luto','gray','candle'],mud:['Mudança de endereço','amber','home']};
const lifeBadge=t=>`<span class="badge b-${LIFE[t][1]}">${ic(LIFE[t][2],11)}${LIFE[t][0]}</span>`;
const NEED={luto:['Luto','gray','candle',100],mazal:['Mazal Tov','purple','heart',70],novo:['Nova família','blue','user',60],queda:['Em queda','red','trend',55],ausente:['Ausente','amber','clock',50],yz:['Yahrzeit','amber','candle',45],mens:['Mensalidade','red','wallet',40]};
function needs(f){
  if(f.status!=='Ativo')return[];
  const out=[],lc=lastCt(f.id),add=(k,txt,x)=>{if(!S.done.has(f.id+'|'+k))out.push(Object.assign({k,txt,f,w:NEED[k][3]},x))};
  for(const l of DB.life){
    if(l.fid!==f.id)continue;const d=diffDays(TODAY,l.data);
    if(l.tipo==='luto'&&d>=0&&d<=30&&lc<l.data)add('luto','Luto '+ago(l.data)+'.'+(l.det?' '+l.det:''));
    else if(['nasc','brit','bar','noiv','casam'].includes(l.tipo)&&d>=0&&d<=14&&lc<l.data)add('mazal',LIFE[l.tipo][0]+' '+ago(l.data)+'.'+(l.det?' '+l.det:''),{life:l.tipo});
  }
  if(diffDays(TODAY,f.cad)<=30&&lc<f.cad)add('novo','Cadastrada '+ago(f.cad)+', ainda sem contato da equipe.');
  const quiet=!lc||diffDays(TODAY,lc)>7;
  if(quiet&&scDrop(f)>=20)add('queda','Engajamento caiu de '+f.sc0+' para '+score(f)+'.'+(f.pres?' Última presença '+ago(f.pres.data)+'.':''));
  else if(quiet&&isAbsent(f))add('ausente','Frequenta o Shabat e não vem '+(f.pres?'desde '+fmtDate(f.pres.data):'há várias semanas')+'.');
  const y=nextYz(f.id);if(y&&diffDays(yzNext(y),TODAY)<7)add('yz','Yahrzeit de '+y.nome+' '+inDays(yzNext(y))+' ('+y.d+' de '+y.m+').',{yz:y});
  if(can('fin')&&mensStatus(f)==='late'){const ps=ixOf(IX.pay,f.id).filter(p=>!p.pagoEm&&p.venc<TODAY);add('mens',pl(ps.length,'mensalidade vencida','mensalidades vencidas')+', '+BRL(sum(ps,p=>p.valor))+'.')}
  return out;
}
const allNeeds=()=>memo('needs',()=>{const a=[];DB.fam.forEach(f=>{const n=needs(f);if(n.length)a.push(...n)});const sc=new Map();a.forEach(n=>{if(!sc.has(n.f))sc.set(n.f,score(n.f))});return a.sort((x,y)=>y.w-x.w||sc.get(y.f)-sc.get(x.f))});
function topNeeds(k){const top=[];allNeeds().forEach(n=>{if(top.length<k&&!top.some(t=>t.f===n.f))top.push(n)});return top}
function draftFor(n){
  const f=n.f,r=respOf(f),nm=r?r.nome.split(' ')[0]:'',tp=t=>(DB.tpl.find(x=>x.nome===t)||{txt:''}).txt;
  switch(n.k){
    case 'luto':return `Shalom ${nm}. Soubemos da perda na sua família e queremos que saibam que toda a comunidade está com vocês. Se precisarem de minian, de refeições ou apenas de companhia, contem conosco. HaMakom yenachem etchem.`;
    case 'mazal':return `Mazal Tov, ${nm}! Ficamos muito felizes com a notícia. Que seja com muita saúde e alegria para toda a família. Se pudermos ajudar em algo, é só avisar.`;
    case 'novo':return `Shalom ${nm}! Que alegria ter a sua família conosco no Chai Menachem. Quando puderem, venham ao Kabalat Shabat de sexta-feira, será um prazer recebê-los. Qualquer dúvida, estou à disposição.`;
    case 'queda':case 'ausente':return `Shalom ${nm}! Sentimos a falta de vocês nos últimos Shabatot. Está tudo bem? Nesta sexta teremos Kabalat Shabat e Kidush, seria uma alegria rever a família.`;
    case 'yz':return n.yz?fillTpl(tp('Lembrete de yahrzeit'),{nome:nm,falecido:n.yz.nome,data_hebraica:n.yz.d+' de '+n.yz.m,data:fmtDate(yzNext(n.yz))}):'';
    case 'mens':{const p=ixOf(IX.pay,f.id).filter(x=>!x.pagoEm&&x.venc<TODAY).sort(by(x=>x.venc))[0];return fillTpl(tp('Mensalidade em atraso'),{nome:nm,competencia:p?compTxt(p.comp):''})}
  }
  return '';
}
const needBadge=k=>`<span class="badge b-${NEED[k][1]}">${ic(NEED[k][2],11)}${NEED[k][0]}</span>`;
const needActs=n=>`<button type="button" class="btn btn-sm btn-green" data-act="needWa" data-id="${n.f.id}" data-arg="${n.k}">${ic('wa',13)}WhatsApp</button><button type="button" class="btn btn-sm" data-act="needDone" data-id="${n.f.id}" data-arg="${n.k}">${ic('check',13)}Feito</button>`;
const needCard=n=>`<div class="need"><div class="who">${famAv(n.f,'av-sm')}<button type="button" class="btn-link" style="color:var(--ink)" data-go="familia-${n.f.id}">${esc(famName(n.f))}</button></div><div>${needBadge(n.k)}</div><p>${esc(n.txt)}</p><div class="pacts">${needActs(n)}</div></div>`;
const sugCard=link=>{const t=topNeeds(5);return `<div class="card"><div class="ch"><div class="ct">${ic('spark',16)}Sugestões da semana</div>${link?`<button type="button" class="btn-link" data-go="contatar">Ver todos (${allNeeds().length})</button>`:'<small>As 5 famílias que mais vale a pena procurar agora</small>'}</div>${t.length?`<div class="g5">${t.map(needCard).join('')}</div>`:empty('Ninguém para contatar agora.','A equipe está em dia.')}</div>`};

/* ---- escrever com IA ---- */
const ALT=[n=>`Shalom ${n}! Tudo bem com vocês? Passando para saber como está a família e lembrar que as portas do Chai Menachem estão sempre abertas. Um abraço de toda a comunidade.`,n=>`Shalom ${n}! Espero que estejam todos bem. Queria convidar a família para estar conosco neste Shabat. Se precisar de qualquer coisa, pode contar com a gente.`];
A.waIA=async()=>{
  const w=S.wa,ta=$('#wa-txt'),b=$('#wa-ia');if(!ta||!w)return;
  const f=FAM.get(w.fid),p=PPL.get(w.pid)||respOf(f),nome=p?p.nome.split(' ')[0]:'',lab=b.querySelector('span');
  let sample=null,done=false;
  if(window.claude&&window.claude.use){b.disabled=true;lab.textContent='Escrevendo…';try{sample=await window.claude.use('sample')}catch(e){}}
  if(sample){
    try{
      const r=await sample('Você escreve mensagens de WhatsApp em português do Brasil para a secretaria de uma comunidade judaica chamada Chai Menachem. Escreva UMA mensagem curta (até 60 palavras), calorosa e respeitosa, sem emojis, começando com "Shalom '+nome+'". Contexto: '+(w.ctx||'contato de rotina com uma família da comunidade')+'. '+(ta.value.trim()?'Reescreva este rascunho de outro jeito, mantendo o sentido: "'+ta.value.trim()+'". ':'')+'Responda só com o texto da mensagem.',{modelTier:'quick',cache:false});
      if($('#wa-txt')===ta&&r&&r.text){ta.value=r.text.trim();done=true}
    }catch(e){}
  }
  if(!done){w.n=(w.n||0)+1;ta.value=ALT[w.n%ALT.length](nome)}
  if($('#wa-txt')===ta){A.waTxt(ta);b.disabled=false;lab.textContent='Escrever com IA'}
};

}

/* ================= dados de exemplo dos novos módulos ================= */
function seed2(){
  const R=rng(770),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],ch=p=>R()<p;
  const [cohen,levy,,,,]=DB.fam,lastSat=addDays(TODAY,-((toDate(TODAY).getDay()+1)%7));
  DB.users=[{id:1,nome:'Mendi',papel:'Administrador',email:'mendi@exemplo.com'},{id:2,nome:'Secretaria',papel:'Secretária',email:'secretaria@exemplo.com'},{id:3,nome:'Rabino',papel:'Rabino',email:'rabino@exemplo.com'},{id:4,nome:'Voluntário de eventos',papel:'Voluntário',email:'voluntario@exemplo.com'}];

}

/* ================= Calendário judaico ================= */
const LOC={lat:-23.55,lng:-46.63,tz:-3};
function sunAt(iso,zen){
  const d=toDate(iso),N=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/864e5)+1,g=2*Math.PI/365*(N-.5);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const la=LOC.lat*Math.PI/180,ha=Math.acos(Math.cos(zen*Math.PI/180)/(Math.cos(la)*Math.cos(dec))-Math.tan(la)*Math.tan(dec))*180/Math.PI;
  return 720-4*(LOC.lng-ha)-eq+LOC.tz*60;
}
const hm=m=>{m=Math.round(m);return pad(Math.floor(m/60))+':'+pad(m%60)};
const velas=iso=>hm(sunAt(iso,90.833)-18),havdala=iso=>hm(sunAt(iso,98.5));
const HOLS={'Tishrei|1':'Rosh Hashaná','Tishrei|2':'Rosh Hashaná','Tishrei|10':'Yom Kipur','Tishrei|15':'Sucot','Tishrei|16':'Sucot','Tishrei|21':'Hoshaná Rabá','Tishrei|22':'Shemini Atseret','Tishrei|23':'Simchat Torá','Kislev|19':'Yud-Tes Kislev','Shevat|10':'Yud Shevat','Shevat|15':'Tu BiShvat','Adar|14':'Purim','Adar II|14':'Purim','Nissan|11':'Yud-Alef Nissan','Nissan|15':'Pessach','Nissan|16':'Pessach','Nissan|21':'Pessach','Nissan|22':'Pessach','Iyar|18':'Lag BaOmer','Sivan|6':'Shavuot','Sivan|7':'Shavuot','Tamuz|3':'Guimel Tamuz','Elul|18':'Chai Elul'};
function holiday(iso){
  const h=HEB.of(iso);if(!h)return '';const k=HOLS[h.m+'|'+h.d];if(k)return k;
  if(h.m==='Tishrei'&&h.d>=17&&h.d<=20)return 'Chol Hamoed Sucot';if(h.m==='Nissan'&&h.d>=17&&h.d<=20)return 'Chol Hamoed Pessach';
  if(h.m==='Kislev'||h.m==='Tevet')for(let n=0;n<8;n++){const x=HEB.of(addDays(iso,-n));if(x.m==='Kislev'&&x.d===25)return 'Chanucá · dia '+(n+1)}
  const dow=toDate(iso).getDay();if(h.m==='Av'&&((h.d===9&&dow!==6)||(h.d===10&&dow===0)))return 'Tishá BeAv';
  return h.d===1||h.d===30?'Rosh Chodesh':'';
}
function pgCalendario(){
  if(!HEB.ok)return head('Calendário judaico','')+`<div class="card">${empty('Este navegador não calcula o calendário judaico.','Abra em um navegador atualizado.')}</div>`;
  const u=S.ui.cal,[y,m]=u.m.split('-').map(Number),first=u.m+'-01',off=toDate(first).getDay(),dim=new Date(y,m,0).getDate(),weeks=Math.ceil((off+dim)/7);
  const prevM=m===1?(y-1)+'-12':y+'-'+pad(m-1),nextM=m===12?(y+1)+'-01':y+'-'+pad(m+1),bd=memo('bd',()=>{const o={};DB.ppl.forEach(p=>{if(p.nasc){const k=p.nasc.slice(5);o[k]=(o[k]||0)+1}});return o});
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(first,i-off),h=HEB.of(d),hol=holiday(d),dow=i%7,evs=DB.ev.filter(e=>!e.cancel&&e.data===d),yz=DB.yz.filter(z=>HEB.same(h,z.m,z.d)).length,b=bd[d.slice(5)]||0;

      ${hol?`<span class="hol" title="${esc(hol)}">${esc(hol)}</span>`:''}${dow===5?`<span class="tm">Velas ${velas(d)}</span>`:dow===6?`<span class="tm">Havdalá ${havdala(d)}</span>`:''}
      ${evs.slice(0,2).map(e=>`<button type="button" class="ev evb" title="${esc(e.nome)}" data-go="evento-${e.id}">${esc(e.nome)}</button>`).join('')}

  return head('Calendário judaico','Datas hebraicas, festas, horários de Shabat, eventos, yahrzeits e aniversários no mesmo lugar')+
  `<div class="split split-w"><div class="card pad0"><div class="toolbar" style="padding-bottom:12px;justify-content:space-between"><div class="ct">${MESES[m-1]} de ${y}</div><div class="seg"><button type="button" data-tab="cal.m:${prevM}" aria-label="Mês anterior">${ic('prev',14)}</button><button type="button" data-tab="cal.m:${YM}">Hoje</button><button type="button" data-tab="cal.m:${nextM}" aria-label="Próximo mês">${ic('next',14)}</button></div></div>
    <div class="tw"><div class="cal cal2">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dw">${d}</div>`).join('')}${cells}</div></div></div>
  <aside class="rail">
    <div class="card"><div class="cap">Shabat desta semana</div><div class="rows"><div class="rw"><span class="grow">Acendimento das velas<small style="display:block">Sexta-feira, ${fmtDM(fri)}</small></span><b class="num">${velas(fri)}</b></div><div class="rw"><span class="grow">Havdalá<small style="display:block">Sábado, ${fmtDM(sat)}</small></span><b class="num">${havdala(sat)}</b></div></div>
      <p class="hint" style="margin-top:8px">Horários aproximados para São Paulo, calculados pelo pôr do sol. Confira com o calendário oficial da comunidade.</p></div>
    <div class="card"><div class="cap">Próximas datas</div><div class="rows">${prox.map(p=>`<div class="rw"><span class="grow"><b>${esc(p[0])}</b><small style="display:block">${HEB.txt(HEB.of(p[1]))}</small></span><span class="right num">${fmtDate(p[1])}<small style="display:block">${inDays(p[1])}</small></span></div>`).join('')}</div></div>

}

/* ================= Importação de planilha ================= */
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('rede'));document.head.appendChild(s)})}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const l1=t.split(/\r?\n/)[0]||'',sep=(l1.match(/;/g)||[]).length>=(l1.match(/,/g)||[]).length?';':',',rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
function impAnalyze(rows){
  if(rows.length<2)return{err:'O arquivo precisa ter uma linha de títulos e pelo menos uma família.'};
  const H=rows[0].map(h=>norm(h)),find=(ks,not)=>H.findIndex((h,i)=>i!==not&&ks.some(k=>h.includes(k)));
  const c={fam:find(['famil','sobrenome'])};c.resp=find(['respons']);if(c.resp<0)c.resp=find(['nome'],c.fam);
  c.tel=find(['telefone','whats','celular','fone']);c.email=find(['mail']);c.cat=find(['categ']);c.bairro=find(['bairro']);
  if(c.fam<0&&c.resp<0)return{err:'Não encontrei as colunas Família ou Responsável na primeira linha.'};
  const dig=s=>String(s||'').replace(/\D/g,''),seen=new Set(DB.fam.map(f=>dig(f.tel)).filter(d=>d.length>=8)),novos=[],dup=[];
  rows.slice(1).forEach(r=>{const g=i=>i>=0?String(r[i]??'').trim():'',resp=g(c.resp),nome=g(c.fam)||resp.split(/\s+/).pop();if(!nome)return;
    const o={nome,resp:resp||nome,tel:g(c.tel),email:g(c.email),cat:CATS.find(x=>norm(x)===norm(g(c.cat)))||'Visitante',bairro:g(c.bairro)},d=dig(o.tel);
    if(d.length>=8&&seen.has(d))dup.push(o);else{novos.push(o);if(d.length>=8)seen.add(d)}});
  return{novos,dup,cols:Object.keys(c).filter(k=>c[k]>=0).length};
}
A.importar=()=>{S.imp=null;openModal({title:'Importar planilha',wide:true,body:`<p class="intro">Envie um arquivo Excel (.xlsx) ou CSV com uma família por linha. O sistema reconhece as colunas pelo título e confere duplicados pelo telefone.</p>
  <div class="fgrid"><div class="field"><label for="imp-file">Arquivo</label><input class="inp" style="padding:5px 8px;height:auto" type="file" id="imp-file" accept=".csv,.txt,.xlsx,.xls" data-on="impFile"><span class="hint">Colunas reconhecidas: Família, Responsável, Telefone, E-mail, Categoria, Bairro.</span></div></div><div id="imp-out" style="margin-top:12px"></div>`,
  footer:`<button type="button" class="btn" data-act="impModelo">${ic('download',15)}Baixar modelo</button><button type="button" class="btn" data-act="closeModal">Cancelar</button><button type="button" class="btn btn-green" id="imp-go" data-act="impGo" disabled>Importar</button>`})};
A.impFile=async el=>{
  const file=el.files&&el.files[0],out=$('#imp-out'),goB=$('#imp-go');if(!file||!out)return;S.imp=null;goB.disabled=true;out.innerHTML='<span class="muted">Lendo o arquivo…</span>';
  let rows;
  try{
    if(/\.(csv|txt)$/i.test(file.name))rows=parseCSV(await file.text());
    else{await loadXLSX();const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});rows=window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(x=>String(x).trim()))}
  }catch(e){if($('#imp-out'))out.innerHTML=`<p class="err">Não consegui ler este arquivo. ${e.message==='rede'?'Para arquivos Excel é preciso estar conectado à internet. Você também pode salvar a planilha como CSV.':'Salve a planilha como CSV e tente de novo.'}</p>`;return}
  if(!$('#imp-out'))return;
  const r=impAnalyze(rows);if(r.err){out.innerHTML=`<p class="err">${r.err}</p>`;return}
  S.imp=r;goB.disabled=!r.novos.length;goB.textContent=r.novos.length?'Importar '+pl(r.novos.length,'família','famílias'):'Importar';
  out.innerHTML=`<div class="g3">${stat('users','green','Famílias novas',NUM(r.novos.length))}${stat('copy','amber','Duplicadas',NUM(r.dup.length),'mesmo telefone, não entram')}${stat('list','blue','Colunas reconhecidas',r.cols+' de 6')}</div>
    ${r.novos.length?`<div class="tw" style="margin-top:12px"><table class="tbl" style="min-width:420px"><thead><tr><th>Família</th><th>Responsável</th><th>Telefone</th><th>Categoria</th></tr></thead><tbody>${r.novos.slice(0,5).map(o=>`<tr><td><b>${esc(o.nome)}</b></td><td>${esc(o.resp)}</td><td class="num">${esc(o.tel)}</td><td>${esc(o.cat)}</td></tr>`).join('')}</tbody></table></div>${r.novos.length>5?`<p class="hint" style="margin-top:6px">E mais ${r.novos.length-5}.</p>`:''}`:''}`;
};
A.impGo=()=>{const r=S.imp;if(!r||!r.novos.length)return;r.novos.forEach(o=>createFam(Object.assign({origem:'Importação de planilha'},o)));const n=r.novos.length;S.imp=null;closeModal();Object.assign(S.ui.fl,{q:'',cat:'',status:'',mens:'',part:'',cad:'',tag:'',tab:'todos',page:1});go('familias');render();toast(pl(n,'família importada','famílias importadas')+(r.dup.length?'. '+pl(r.dup.length,'duplicada ficou','duplicadas ficaram')+' de fora.':'.'))};

A.gsearch=el=>{
  const box=el.closest('.gs-wrap').querySelector('.gs-res'),q=norm(el.value).trim(),qd=el.value.replace(/\D/g,'');
  if(q.length<2){box.hidden=true;return}
  const fam=DB.fam.filter(f=>famSearch(f).includes(q)||(qd.length>=4&&famSearch(f).includes(qd))).slice(0,5),ppl=DB.ppl.filter(p=>norm(p.nome).includes(q)).slice(0,5);
  const evs=DB.ev.filter(e=>norm(e.nome).includes(q)).sort((a,b)=>(a.data<TODAY)-(b.data<TODAY)||(a.data<b.data?-1:1)).slice(0,3),yz=DB.yz.filter(y=>norm(y.nome).includes(q)).slice(0,3);
  const sec=(t,h)=>h?`<div class="cap">${t}</div>${h}`:'';
  box.innerHTML=sec('Famílias',fam.map(f=>`<button type="button" data-go="familia-${f.id}">${famAv(f,'av-sm')}<span><b>${esc(famName(f))}</b><small>${esc((respOf(f)||{}).nome||'')} · ${esc(f.tel)}</small></span></button>`).join(''))+
    sec('Pessoas',ppl.map(p=>`<button type="button" data-go="pessoa-${p.id}">${pAv(p,'av-sm')}<span><b>${esc(p.nome)}</b><small>${esc(famName(FAM.get(p.fid)))}</small></span></button>`).join(''))+
    sec('Eventos',evs.map(e=>`<button type="button" data-go="evento-${e.id}">${dotIc('calendar','blue')}<span><b>${esc(e.nome)}</b><small>${fmtDate(e.data)}</small></span></button>`).join(''))+
    sec('Yahrzeits',yz.map(y=>`<button type="button" data-go="familia-${y.fid}" data-gtab="famTab:yahrzeit">${dotIc('candle','amber')}<span><b>${esc(y.nome)}</b><small>${y.d} de ${esc(y.m)} · ${esc(famName(FAM.get(y.fid)))}</small></span></button>`).join(''))
    ||`<div class="empty" style="padding:16px"><b>Nada encontrado.</b>Tente outro nome ou telefone.</div>`;
  box.hidden=false;
};
const hideSearch=()=>document.querySelectorAll('.gs-res').forEach(b=>{b.hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('.gs-wrap'))hideSearch()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideSearch()});

/* ================= Resumo da semana ================= */
function resumoTxt(){
  const d7=addDays(TODAY,-7),n7=addDays(TODAY,7),inW=d=>d&&d>d7&&d<=TODAY,nv=DB.fam.filter(f=>inW(f.cad)),late=lateList(),life=DB.life.filter(l=>inW(l.data)),top=topNeeds(5);
  const rec=sum(DB.pay.filter(p=>inW(p.pagoEm)),p=>p.valor)+sum(DB.don.filter(d=>inW(d.data)),d=>d.valor),yz=DB.yz.filter(y=>{const n=yzNext(y);return n&&n<=n7}).sort(by(yzNext)),evs=DB.ev.filter(e=>!e.cancel&&e.data>=TODAY&&e.data<=n7).sort(by(e=>e.data));
  const lastSat=addDays(TODAY,-((toDate(TODAY).getDay()+1)%7)),att=DB.att[lastSat+'|Shabat'];
  return ['Resumo da semana · Chai Menachem · '+fmtDate(TODAY),'',
    'Presença no último Shabat: '+(att?att.size:0)+' famílias.',
    'Novas famílias: '+nv.length+(nv.length?' ('+nv.map(f=>f.nome).join(', ')+').':'.'),
    'Recebido na semana: '+BRL(rec)+'.',
    'Mensalidades em atraso: '+pl(late.length,'família','famílias')+', '+BRL(sum(late,x=>x.v))+'.',
    'Momentos: '+(life.length?life.map(l=>LIFE[l.tipo][0]+' na '+famName(FAM.get(l.fid))).join('; ')+'.':'nenhum registrado.'),
    'Yahrzeits nos próximos 7 dias: '+(yz.length?yz.map(y=>y.nome+' ('+fmtDM(yzNext(y))+', '+famName(FAM.get(y.fid))+')').join('; ')+'.':'nenhum.'),
    'Eventos da semana: '+(evs.length?evs.map(e=>e.nome+' em '+fmtDM(e.data)+' ('+evInsc(e)+' inscritos)').join('; ')+'.':'nenhum.'),
    '','Para contatar primeiro:'].concat(top.map((n,i)=>(i+1)+'. '+famName(n.f)+': '+NEED[n.k][0]+'. '+n.txt)).join('\n');
}
A.resumoSemana=()=>{const t=resumoTxt();openModal({title:'Resumo da semana',wide:true,body:`<p class="intro">Resumo pronto para enviar ao rabino.</p><textarea class="inp" id="copy-txt" rows="14" readonly>${esc(t)}</textarea>`,
